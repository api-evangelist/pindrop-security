name: Pindrop Security
description: >-
  Pindrop is an Atlanta-based voice security and identity company founded in 2011 by Georgia
  Tech researchers. Its "Real Human + Right Human" platform detects deepfakes, prevents fraud,
  and authenticates callers across voice, video, and digital channels for contact centers and
  virtual meetings. Core products are Pindrop Pulse (deepfake and synthetic-voice detection),
  Pindrop Protect (near real-time fraud risk assessment), and Pindrop Passport (multifactor
  voice, device, and behavioral authentication, including VeriCall technology). Pindrop holds
  300+ patents and integrates with contact-center and meeting platforms such as Amazon Connect,
  Genesys, Five9, NICE, Cisco Webex, Zoom, and Microsoft Teams. The company is an enterprise,
  sales-led vendor and does not publish a self-serve public developer portal or open API.
